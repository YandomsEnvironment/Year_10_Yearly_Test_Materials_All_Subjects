let userAnswers = new Array(passages.length).fill(null);

function renderQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  passages.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.dataset.module = item.module;
    card.id = `q-${idx}`;

    const letters = ['A', 'B', 'C', 'D'];
    let optionsHtml = '';
    item.options.forEach((opt, optIdx) => {
      optionsHtml += `
        <button class="option-btn" onclick="selectOption(${idx}, ${optIdx})" id="opt-${idx}-${optIdx}">
          <span class="option-letter">${letters[optIdx]}</span>
          <span>${opt}</span>
        </button>
      `;
    });

    card.innerHTML = `
      <div class="q-header">
        <span class="q-num">Passage ${idx + 1} of 25</span>
        <span class="q-module">${item.module}</span>
      </div>
      <div class="extract-box">
        <div class="extract-header">📖 ${item.extractTitle}</div>
        <div>${item.extract}</div>
      </div>
      <div class="q-text">${item.q}</div>
      <div class="options-grid">${optionsHtml}</div>
      <div class="explanation-box" id="exp-${idx}"></div>
    `;

    container.appendChild(card);
  });
}

function selectOption(qIdx, optIdx) {
  if (userAnswers[qIdx] !== null) return;

  userAnswers[qIdx] = optIdx;
  const item = passages[qIdx];
  const isCorrect = (optIdx === item.answer);

  for (let i = 0; i < item.options.length; i++) {
    const btn = document.getElementById(`opt-${qIdx}-${i}`);
    btn.classList.add('disabled');
    if (i === item.answer) {
      btn.classList.add('reveal-correct');
    }
  }

  const chosenBtn = document.getElementById(`opt-${qIdx}-${optIdx}`);
  if (isCorrect) {
    chosenBtn.classList.remove('reveal-correct');
    chosenBtn.classList.add('selected-correct');
  } else {
    chosenBtn.classList.add('selected-wrong');
  }

  const expBox = document.getElementById(`exp-${qIdx}`);
  expBox.className = `explanation-box show ${isCorrect ? 'correct' : 'wrong'}`;
  expBox.innerHTML = `
    <div class="exp-title">${isCorrect ? '✅ Well done! Analysis:' : '❌ Not quite. The correct answer is (' + ['A','B','C','D'][item.answer] + '):'}</div>
    <div>${item.exp}</div>
  `;

  updateStats();
}

function updateStats() {
  const answered = userAnswers.filter(a => a !== null).length;
  let correct = 0;
  userAnswers.forEach((ans, idx) => {
    if (ans === passages[idx].answer) correct++;
  });

  document.getElementById('answered-count').innerText = answered;
  document.getElementById('score-count').innerText = correct;
  const pct = answered > 0 ? Math.round((correct / 25) * 100) : 0;
  document.getElementById('score-pct').innerText = `${pct}%`;

  const accuracy = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  document.getElementById('accuracy-pct').innerText = answered > 0 ? `${accuracy}%` : '--';

  const fill = document.getElementById('progress-fill');
  fill.style.width = `${(answered / 25) * 100}%`;
}

function filterQuestions(mod, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const cards = document.querySelectorAll('.q-card');
  cards.forEach(card => {
    if (mod === 'all' || card.dataset.module === mod) {
      card.style.display = 'block';
    } else {
      card.style.display = 'none';
    }
  });
}

function resetQuiz() {
  if (confirm("Reset all 25 passages and score?")) {
    userAnswers = new Array(passages.length).fill(null);
    renderQuiz();
    updateStats();
  }
}

renderQuiz();
updateStats();
</script>
